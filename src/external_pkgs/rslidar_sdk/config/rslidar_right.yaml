common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6700
      difop_port: 7789
      imu_port: 6689
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 2.0    # Changed from 0.2
      max_distance: 150    # Changed from 200
      use_lidar_clock: false # was true
      dense_points: false
      ts_first_point: false # was true
      start_angle: 0
      end_angle: 360
      pcap_repeat: true
      pcap_rate: 1.0
      pcap_path: /home/robosense/lidar.pcap
    ros:
      ros_frame_id: lidar_right_link
      ros_recv_packet_topic: /rslidar_packets_right
      ros_send_packet_topic: /rslidar_packets_right
      ros_send_imu_data_topic: /rslidar_imu_data_right
      ros_send_point_cloud_topic: /rslidar_right/points
      ros_queue_length: 100